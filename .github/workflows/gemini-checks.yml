name: Gemini API checks
on:
  pull_request:
    paths:
      - 'api/chat.js'
      - 'api/chat.test.js'
      - 'package.json'
      - '.github/workflows/gemini-checks.yml'
  push:
    branches: [main]
    paths:
      - 'api/chat.js'
      - 'api/chat.test.js'
      - 'package.json'
      - '.github/workflows/gemini-checks.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run test:gemini
